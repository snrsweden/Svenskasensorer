
name: Build Svenska Sensorer ATAK 5.6

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ATAK Plugin
    runs-on: ubuntu-24.04

    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          test -d "$ANDROID_HOME" || {
            echo "::error::Android SDK is missing"
            exit 1
          }

          echo "Android SDK found"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Configure Gradle permissions
        run: chmod +x ./gradlew

      - name: Verify ATAK TakDev dependency
        shell: bash
        run: |
          if [ -f "atak-gradle-takdev.jar" ]; then
            echo "ATAK TakDev dependency found"
          else
            echo "::error::ATAK TakDev dependency is missing"
            echo "Provide a compatible TakDev JAR or configure authenticated TAK Maven access."
            exit 1
          fi

      - name: Build Svenska Sensorer APK
        shell: bash
        run: |
          ./gradlew assembleCivDebug \
            --stacktrace \
            --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Svenska-Sensorer-ATAK-5.6
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
          
